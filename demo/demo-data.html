function emit(name) { const snap = { metadata:{ fromCache:false }, docs:Object.entries(data[name]||{}).map(([id,d]) => ({ id, data:() => d })) }; (listeners[name]||[]).forEach(cb => cb(snap)); }
// Like the real store: a deep merge, where null clears a field.
const merge = (a, b) => { const out = { ...(a||{}) }; for (const [k,v] of Object.entries(b)) { if (v === null) delete out[k]; else out[k] = typeof v === "object" && !Array.isArray(v) ? merge(out[k], v) : v; } return out; };

  collection(name) { return { onSnapshot(cb) { (listeners[name] ||= []).push(cb); setTimeout(() => emit(name)); return () => {}; } }; },

};
