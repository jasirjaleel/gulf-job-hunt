# Publishes the website in docs/ to GitHub Pages, with the live demo built in.
# It does nothing while the repository is private. Once it's public, set
# Settings -> Pages -> Source to "GitHub Actions" and this runs on every push to main.
name: Website

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - demo/**
      - dashboard/**
      - scripts/build-demo.ts
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Joins the dashboard with the made-up demo data into docs/demo/index.html.
      - run: node scripts/build-demo.ts
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
